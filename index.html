<meta charset="UTF-8">

<title>Gestión Académica de la Permanencia · Universidad Autónoma de Chile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ua-rojo: #DA291C; --ua-gris: #3D3935; --blanco: #FFFFFF;
    --fondo: #F5F5F4; --texto: #3D3935; --texto-suave: #6E6966; --linea: #E4E2E0;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font-family: 'Montserrat', Arial, sans-serif; font-size: 14px; line-height: 1.45; }
  .brandbar { display: flex; height: 6px; } .brandbar i { flex: 1; background: var(--ua-rojo); } .brandbar i + i { background: #231F20; }
  #home { min-height: calc(100vh - 6px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px 28px; background: var(--fondo); }
  .hhero { text-align: center; margin-bottom: 40px; }
  .hhero img { height: 96px; width: auto; }
  .hhero h1 { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.05; margin: 16px 0 6px; text-transform: uppercase; letter-spacing: .4px; color: var(--ua-gris); }
  .hhero h1 span { color: var(--ua-rojo); }
  .hhero p { margin: 0; color: var(--texto-suave); font-size: 13px; letter-spacing: .3px; }
  .hgrid { display: flex; justify-content: center; align-items: stretch; width: 100%; max-width: 760px; }
  .hcard { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 18px 12px 10px; text-decoration: none; color: var(--ua-gris); border-left: 1px solid #CFCBC8; }
  .hcard:first-child { border-left: none; }
  .ht { font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 500; font-size: 34px; text-transform: uppercase; letter-spacing: 6px; line-height: 1.1; padding-left: 6px; text-align: center; transition: color .25s; }
  .hline { display: block; width: 34px; height: 3px; background: var(--ua-rojo); margin-top: 16px; transition: width .3s ease; }
  .hcard small { margin-top: 10px; font-size: 12px; color: var(--texto-suave); letter-spacing: .5px; }
  .hcard:hover .hline, .hcard:focus-visible .hline { width: 110px; }
  .hcard:hover .ht, .hcard:focus-visible .ht { color: var(--ua-rojo); }
  .hcard:focus-visible { outline: none; }
  .hfoot { margin: 44px 0 0; font-size: 12px; color: var(--texto-suave); text-align: center; }
  @media (max-width: 700px) {
    .hgrid { flex-direction: column; align-items: stretch; max-width: 320px; }
    .hhero h1 { font-size: 28px; }
    .hcard { border-left: none; border-top: 1px solid #CFCBC8; padding: 22px 0 14px; }
    .hcard:first-child { border-top: none; }
    .ht { font-size: 28px; letter-spacing: 5px; }
    #home { justify-content: flex-start; padding-top: 40px; }
  }
</style>
</head>
